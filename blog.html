<!DOCTYPE html>
<html>
    <head>
        <title>MagpieTaxi's Website</title>
        <style>
            :root {
                --primary-color: rgb(162, 176, 255);
                --primary-color-deep: rgb(111, 114, 255);
                --secondary-color: rgb(255, 255, 255);
            }

            h1, h2, h3, h4 {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            p {
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                font-size: large;
            }
            footer {
                color: gray;
                margin-bottom: 0.3em;
            }
            .spacer {
                height: 6em;
            }
            .spacer2 {
                height: 4em;
            }
            .spacer3 {
                height: 2em;
            }

            .heading {
                background-color: pink;
                background-image: linear-gradient(to right,var(--primary-color-deep),var(--secondary-color),var(--primary-color-deep));
                width: 100%;
                padding-top: 1.2em;
                padding-bottom: 0.8em;
            }
            .pageheader {
                display: inline;
                padding-left: 0.4em;
                padding-right: 0.4em;
            }

            .content {
                background-color: var(--primary-color);
                background-blend-mode: multiply;
                background-image: url("Images/blog_background.png");
                background-repeat: no-repeat;
                background-size: cover;
                width: 100%;

                padding-top: 0.4em;
                padding-bottom: 0.4em;
                margin-top: 0.3em;
                margin-bottom: 0.3em;
            }
            .selectionContainer {
                display: grid;
                padding-left: 0.4em;
                padding-right: 0.4em;
                width: 75%;
            }
            .selectionContainer * {
                margin-bottom: 0;
                margin-top: 0;
            }
            .selectionContainer a {
                color: black;
                text-decoration: none;
                font-weight: bold;
            }
            .selectionContainer div {
                background-color: white;
                background-image: url(Images/blog_background.png);
                padding: 1em 1em 1em 1em;
                display: inline-block;
            }
            .ColumnalContainer {
                margin-top: .6em;
                margin-bottom: .6em;

                box-shadow: 8px 8px 4px 2px rgba(0, 0, 0, 0.3);
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-gap: 20px;
            }
            .LeftColumn {
                width: 70%;
                justify-self: left;
            }
            .RightColumn {
                width: 20%;
                justify-self: right;
            }

            button {
                padding-left: 3em;
                padding-right: 3em;
                padding-top: 1.5em;
                padding-bottom: 1.5em;
                
                background-color: white;

                font-size: large;

                transition: 
                    background-color 0.3s ease,
                    font-size 0.3s ease,
                    font-weight 0.3s ease,
                    padding-top 0.3s ease,
                    padding-bottom 0.3s ease,
                    padding-left 0.3s ease,
                    padding-right 0.3s ease;
            }
            button:hover {
                background-color: rgb(217, 240, 255);
                font-size: x-large;
                padding-left: 2em;
                padding-right: 2em;
                padding-top: 1em;
                padding-bottom: 1em;

                cursor: pointer;
            }
            button:focus {
                background-color: skyblue;
                font-size: x-large;
                padding-left: 2em;
                padding-right: 2em;
                padding-top: 1em;
                padding-bottom: 1em;

                cursor: progress;
            }

            hr {
                height: 3px;
                color: black;
                background-color: black;
                width: 80%;
            }
        </style>
    </head>
    <body style="background-color: black;">
        <center>
            <div class="heading">
                    <img src="Images/sparkles.png" style="height: 2.5em;" class="pageheader">
                    <h1 class="pageheader">MY BLOG</h1>
                    <img src="Images/sparkles.png" style="height: 2.5em;" class="pageheader">
            </div>
            <div class="content">
                <h2>Welcome to my blog!</h2>
                <p>Click the 'Read' button on a blog entry to read it.<br>This page may be updated frequently!</p>
                <hr>
                <div class="spacer3"></div>
                <div class="selectionContainer">
                    <div class="ColumnalContainer">
                        <div class="LeftColumn">
                            <h2>Hello World! - 7/15/2025</h2>
                            <p>Welcome to my Blog!</p>
                        </div>
                        <div class="RightColumn">
                            <a href="Blog/HelloWorld.html"><button>Read</button></a>
                        </div>
                    </div>
                </div>
                <div class="spacer3"></div>
            </div>
            <div class="footer">
                <div class="spacer2"></div>
                <footer align="center">Designed, programmed, and drawn by MagpieTaxi</footer>
                <footer align="center">Email: magpietaxi@gmail.com</footer>
                <footer><a href="index.html">Homepage</a>ㅤㅤ<a href="aboutme.html">About Me</a>ㅤㅤ<a href="projects.html">Projects</a>ㅤㅤ<a href="blog.html">Blog</a></footer>
            </div>
        </center>
    </body>
</html>
